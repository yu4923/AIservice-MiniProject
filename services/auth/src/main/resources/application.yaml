spring:
  application:
    name: auth-service
  datasource:
    url: "${DB_URL:jdbc:mariadb://localhost:53301/sql_db}"
    username: "${DB_USER:}"
    password: "${DB_PASSWORD:}"
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
  mvc:
    log-request-details: false
  web:
    resources:
      add-mappings: false

server:
  port: "${SERVER_PORT:8080}"
  address: "${SERVER_ADDRESS:127.0.0.1}"
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

auth:
  jwt-secret: "${JWT_SECRET:}"
  jwt-issuer: simple-auth-server
  frontend-origin: "${FRONTEND_ORIGIN:http://localhost:5174}"
  login-success-url: "${LOGIN_SUCCESS_URL:${auth.frontend-origin}}"
  cookie-secure: "${COOKIE_SECURE:false}"

logging:
  level:
    # JDBC 시작 오류에 계정·접속 정보가 포함될 수 있어 로그 노출을 막는다.
    com.zaxxer.hikari: "OFF"
    org.mariadb.jdbc: "OFF"
    # 시작 예외의 하위 원인에도 JDBC 계정·접속 정보가 포함될 수 있다.
    org.springframework.context: "OFF"
    org.springframework.boot.SpringApplication: "OFF"
    org.springframework.boot.diagnostics: "OFF"
    # 바인딩된 값과 데이터베이스 예외 상세 정보의 노출을 막는다.
    org.hibernate: "OFF"
    org.springframework.orm.jpa: "OFF"
