server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vue Router owns these routes, including direct visits and refreshes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Missing static files must return 404 instead of the Vue HTML page.
    location /assets/ {
        try_files $uri =404;
    }

    location /figma/ {
        try_files $uri =404;
    }
}
